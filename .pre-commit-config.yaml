priorities:
  fix: 0
  fix-py: 10
  fix-eol: 20
  fix-whitespace: 30
  check: 40

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--exit-non-zero-on-fix"]
        priority: fix
      - id: ruff-format
        priority: fix-py

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-case-conflict
        priority: check
      - id: check-merge-conflict
        priority: check
      - id: check-toml
        priority: check
      - id: check-yaml
        priority: check
      - id: debug-statements
        priority: check
      - id: end-of-file-fixer
        exclude: tests/fixtures/xfail/missing-newline-at-end-of-file.rst
        priority: fix-eol
      - id: trailing-whitespace
        exclude: tests/fixtures/xfail/trailing-whitespaces.rst
        priority: fix-whitespace

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc  # frozen: 0.38.2
    hooks:
      - id: check-dependabot
        priority: check
      - id: check-github-workflows
        priority: check

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        priority: check

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        priority: check

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: a72ae8edd6eeddb9d942168912362945651212f8  # frozen: v2.30.1
    hooks:
      - id: pyproject-fmt
        additional_dependencies: [tox]
        priority: fix

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3  # frozen: 0.26
    hooks:
      - id: validate-pyproject
        priority: check

  - repo: https://github.com/tox-dev/tox-ini-fmt
    rev: 241ced4140307006cfd8b2b9ccfd43b1139cfe4a  # frozen: 1.9.0
    hooks:
      - id: tox-ini-fmt
        priority: fix

  - repo: meta
    hooks:
      - id: check-hooks-apply
        priority: check
      - id: check-useless-excludes
        priority: check

ci:
  autoupdate_schedule: quarterly
